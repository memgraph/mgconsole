[package]
name = "mgconsole"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust Memgraph console (interactive REPL frontend)."

[lints]
workspace = true

[[bin]]
name = "mgconsole"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
mgconsole-core = { path = "../core" }
rpassword = "7.5.4"
rustyline = { version = "15", features = ["derive", "with-file-history"] }
terminal_size = "0.4"
tokio = { workspace = true }
