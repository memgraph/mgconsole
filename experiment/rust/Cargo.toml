[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
bolt-client = "0.11"
bolt-proto = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.8"
thiserror = "2"

# Central lint policy (applied via `[lints] workspace = true` in each crate).
# unsafe is forbidden — ADR 0001's "pure Rust, no unsafe boundary" becomes a
# compile-time guarantee. Warnings stay at `warn` (not `deny`) so mid-development
# todos/unused imports don't block the build; clippy is advisory.
[workspace.lints.rust]
unsafe_code = "forbid"

# `all` and `pedantic` give us idiomatic-Rust nudges; both run at `warn` (see
# above for why not `deny`). They carry `priority = -1` so the individual
# `allow`s below — which sit at the default priority 0 — win over the groups.
# Each `allow` is a conscious opt-out, not an oversight:
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pure noise / near-universally disabled: flags every `FooError` in `foo.rs`.
module_name_repetitions = "allow"
# This is an end-user binary, not a published library: `#[must_use]` spam and
# `# Errors`/`# Panics` doc sections on internal fns add ceremony, not safety.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Numeric casts here (row counts, buffer sizes, Bolt ints) are deliberate and
# reviewed at the call site; a blanket warn would bury the signal in noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Subjective style calls we don't want clippy adjudicating:
similar_names = "allow"
too_long_first_doc_paragraph = "allow"
